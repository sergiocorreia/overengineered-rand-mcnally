[template]
initialized = true

[project]
name = "Rand McNally Bankers' Directory OCR Revision"
slug = "rand-mcnally-v2"
description = "Audit and selectively re-extract problematic pages from the Rand McNally Bankers' Directory panel."

[restoration]
